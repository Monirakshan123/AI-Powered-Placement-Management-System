<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RecruitIQ | Post Job</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{

    min-height:100vh;

    background:radial-gradient(circle at top,#0ea5e9,#0f172a);

    color:white;

}

/* Navbar */

.navbar{

    height:70px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 60px;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(15px);

    box-shadow:0 8px 20px rgba(0,0,0,.2);

}

.logo{

    font-size:28px;

    font-weight:bold;

}

.logo span{

    color:#38bdf8;

}

.back-btn{

    text-decoration:none;

    color:white;

    background:linear-gradient(135deg,#2563eb,#0ea5e9);

    padding:10px 20px;

    border-radius:10px;

    transition:.3s;

}

.back-btn:hover{

    transform:translateY(-2px);

}

/* Main */

.container{

    width:90%;

    max-width:1000px;

    margin:40px auto;

}

.heading{

    text-align:center;

    margin-bottom:30px;

}

.heading h1{

    font-size:38px;

}

.heading p{

    color:#cbd5e1;

    margin-top:8px;

}

/* Card */

.form-card{

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(18px);

    border-radius:25px;

    padding:35px;

    box-shadow:0 20px 45px rgba(0,0,0,.35);

}

.form-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:22px;

}

.input-box{

    display:flex;

    flex-direction:column;

}

.full-width{

    grid-column:1/3;

}

label{

    margin-bottom:8px;

    font-weight:600;

}

.required{

    color:#ef4444;

}

input,
textarea,
select{

    width:100%;

    padding:14px;

    border:none;

    outline:none;

    border-radius:12px;

    font-size:15px;

    background:rgba(255,255,255,.95);

}

input:focus,
textarea:focus,
select:focus{

    box-shadow:0 0 10px #38bdf8;

}

textarea{

    resize:none;

    min-height:170px;

}

/* Button */

.submit-btn{

    width:100%;

    margin-top:30px;

    padding:16px;

    border:none;

    border-radius:14px;

    background:linear-gradient(135deg,#22d3ee,#2563eb);

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}

.submit-btn:hover{

    transform:translateY(-4px);

    box-shadow:0 15px 35px rgba(14,165,233,.45);

}

/* Responsive */

@media(max-width:768px){

.form-grid{

grid-template-columns:1fr;

}

.full-width{

grid-column:auto;

}

.navbar{

padding:20px;

}

.heading h1{

font-size:30px;

}

}

</style>

</head>

<body>

<nav class="navbar">

<div class="logo">

Recruit<span>IQ</span>

</div>

<a href="{% url 'hr_dashboard' %}" class="back-btn">

← Dashboard

</a>

</nav>

<div class="container">

<div class="heading">

<h1>Post New Job Opportunity</h1>

<p>Create a professional job posting for students.</p>

</div>

<div class="form-card">

<form method="POST">

{% csrf_token %}

<div class="form-grid">

<div class="input-box">

<label>

Job Title <span class="required">*</span>

</label>

<input
type="text"
name="job_title"
placeholder="Software Engineer"
required>

</div>

<div class="input-box">

<label>

Company Name <span class="required">*</span>

</label>

<input
type="text"
name="company_name"
placeholder="ABC Technologies"
required>

</div>

<div class="input-box">

<label>

Location <span class="required">*</span>

</label>

<input
type="text"
name="location"
placeholder="Chennai"
required>

</div>

<div class="input-box">

<label>

Salary Package

</label>

<input
type="text"
name="salary"
placeholder="₹6 LPA">

</div>

<div class="input-box">

<label>

Qualification <span class="required">*</span>

</label>

<input
type="text"
name="qualification"
placeholder="B.E / B.Tech / MCA"
required>

</div>

<div class="input-box">

<label>

Application Deadline <span class="required">*</span>

</label>

<input
type="date"
name="deadline"
required>

</div>

<div class="input-box full-width">

<label>

Required Skills <span class="required">*</span>

</label>

<input
type="text"
name="skills_required"
placeholder="Python, Django, SQL, Communication Skills"
required>

</div>

<div class="input-box full-width">

<label>

Job Description <span class="required">*</span>

</label>

<textarea
name="description"
placeholder="Describe job responsibilities, eligibility, benefits and hiring process..."
required></textarea>

</div>

</div>

<button class="submit-btn">

🚀 Publish Job Opportunity

</button>

</form>

</div>

</div>

</body>

</html>
