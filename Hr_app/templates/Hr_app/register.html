{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RecruitIQ - Student Registration</title>
<link rel="stylesheet" href="{% static 'student_app/register.css' %}">

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">


<div class="brand">

<div class="logo">
<img src="{% static 'images/logo1.png' %}">
</div>

<h2>
RecruitIQ
</h2>

</div>



<div class="nav-right">


<div class="theme" id="themeBtn">
🌙
</div>


<div class="menu-btn" id="menuBtn">

<span></span>
<span></span>
<span></span>

</div>


</div>



<div class="menu" id="menu">


<a href="home.html">
Home
</a>


<a href="register.html">
Register
</a>


<a href="#">
Logout
</a>


</div>


</nav>





<!-- REGISTER CARD -->


<div class="container">



<div class="register-card">


<h1>
Employee Registration
</h1>


<p>
Revolutionize recruitment with AI-powered assessment
</p>



<form id="registerForm" method="POST">
    {% csrf_token %}

<div class="input-box">

<label>
Full Name  <span class="required">*</span>
</label>

<input 
type="text"
name="name"
id="Name"
placeholder="Enter your Full Name"
required>

</div>



<div class="input-box">

<label>
Current Company <span class="required">*</span>
</label>

<input 
type="text"
id="website"
name="company_name"
placeholder="Enter your current company"
required>

</div>





<div class="input-box">

<label>
Job Title <span class="required">*</span>
</label>

<input 
type="text"
name="job"
id="contact"
placeholder="Enter your job title"
required>

</div>





<div class="input-box">

<label>
Email ID <span class="required">*</span>
</label>

<input 
type="email"
name="email"
id="email"
placeholder="Enter email"
required>

</div>





<div class="input-box">

<label>
Password <span class="required">*</span>
</label>

<input 
type="password"
name="password"
id="password"
placeholder="Create password"
required>

</div>





<div class="input-box">

<label>
Confirm Password <span class="required">*</span>
</label>

<input 
type="password"
id="confirmPassword"
placeholder="Confirm password"
required>

</div>



<p id="error"></p>



<button type="submit" class="register-btn">

Register as Employee

</button>
{% if messages %}

{% for message in messages %}

<p class="error">
{{ message }}
</p>

{% endfor %}

{% endif %}




</form>


</div>


</div>







<script src="{% static 'Hr_app/register.js' %}"></script>


</body>

</html>
