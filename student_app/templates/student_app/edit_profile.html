{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <link rel="stylesheet" href="{% static 'student_app/edit_profile.css' %}">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="form-card">

        <h1><i class="fa-solid fa-user-pen"></i> Edit Profile</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <!-- Personal Information -->

            <div class="section">
                <h2>Personal Information</h2>

                <div class="grid">

                    <div>
                        <label>Full Name</label>
                        <input type="text" name="name" value="{{ student.name }}">
                    </div>

                    <div>
                        <label>Email</label>
                        <input type="email" name="email" value="{{ student.email }}">
                    </div>

                    <div>
                        <label>Phone</label>
                        <input type="tel" maxlength="10"
                         pattern="[0-9]{10}"
                         placeholder="Enter 10-digit phone number"
                         required
                         name="phone" value="{{ student.phone }}">
                    </div>

                    <div>
                        <label>Gender</label>
                        <select name="gender">
                            <option value="">Select Gender</option>
                            <option value="Male" {% if student.gender == "Male" %}selected{% endif %}>Male</option>
                            <option value="Female" {% if student.gender == "Female" %}selected{% endif %}>Female</option>
                            <option value="Other" {% if student.gender == "Other" %}selected{% endif %}>Other</option>
                        </select>
                    </div>

                </div>
            </div>

            <!-- Academic Details -->

            <div class="section">

                <h2>Academic Details</h2>

                <div class="grid">

                    <div>
                        <label>College</label>
                        <input type="text" name="college" value="{{ student.college }}">
                    </div>

                    <div>
                        <label>Department</label>
                        <input type="text" name="department" value="{{ student.department }}">
                    </div>

                    <div>
                        <label>Year</label>
                        <input type="text" name="year" value="{{ student.year }}">
                    </div>

                    <div>
                        <label>CGPA</label>
                        <input type="text" name="cgpa" value="{{ student.cgpa }}">
                    </div>

                </div>

            </div>

            <!-- Skills -->

            <div class="section">

                <h2>Skills</h2>

                <textarea name="skills" rows="5">{{ student.skills }}</textarea>

            </div>

            <!-- Uploads -->

            <div class="section">

                <h2>Uploads</h2>

                <label>Profile Photo</label>
                <input type="file" name="profile_photo">

                <br><br>

                <label>Resume</label>
                <input type="file" name="resume">

            </div>

            <button type="submit">
                <i class="fa-solid fa-floppy-disk"></i>
                Save Changes
            </button>

        </form>

    </div>

</div>

</body>
</html>
