<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>RecruitIQ - Student Registration</title>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">


<div class="brand">

<div class="logo">
<img src="{% static 'images/logo1.png' %}">
</div>

<h2>
RecruitIQ
</h2>

</div>



<div class="nav-right">


<div class="theme" id="themeBtn">
🌙
</div>


<div class="menu-btn" id="menuBtn">

<span></span>
<span></span>
<span></span>

</div>


</div>



<div class="menu" id="menu">


<a href="home.html">
Home
</a>


<a href="register.html">
Register
</a>

Logout

</div>


</nav>





<!-- REGISTER CARD -->


<div class="container">



<div class="register-card">


<h1>
Student Registration <span class="required">*</span>
</h1>


<p>
Create your RecruitIQ student account
</p>



<form id="registerForm" method="POST">
{% csrf_token %}
{% if error %} 
    <div class="error-box">
     {{ error }} 
    </div> 
     {% endif %}
    <div class="input-box">

<label>
Full Name  <span class="required">*</span>
</label>

<input 
type="text"
id="name"
name="name"
placeholder="Enter full name"
required>

</div>





<div class="input-box"> 
    <label>College <span class="required">*</span></label> <br>
    <select name="college" required> 
        <option value="">Select your college</option> 
        {% for institution in institutions %} 
        <option value="{{ institution.institution_name }}"> 
            {{ institution.institution_name }} 
        </option> 
        {% endfor %} 
    </select> 
</div>





<div class="input-box">

<label>
Email ID  <span class="required">*</span>
</label>

<input 
type="email"
id="email"
name="email"
placeholder="Enter email"
required>

</div>
<div class="input-box">

<label>
Registration Number  <span class="required">*</span>
</label>

<input 
type="number"
id="regno"
name="registerno"
placeholder="Enter registration number"
required>

</div>

<div class="input-box">

<label>
Department  <span class="required">*</span>
</label>

<input 
type="text"
id="text"
name="department"
placeholder="Enter your department"
required>

</div>
<div class="input-box">

<label>
Year of study <span class="required">*</span>
</label>

<input 
type="number"
id="year"
name="year"
placeholder="Enter your year of study"
required>

</div>





<div class="input-box">

<label>
Password  <span class="required">*</span>
</label>

<input 
type="password"
id="password"
name="password"
placeholder="Create password"
required>

</div>





<div class="input-box">

<label>
Confirm Password  <span class="required">*</span>
</label>

<input 
type="password"
id="confirmPassword"
placeholder="Confirm password"
required>

</div>



<p id="error"></p>



    <button type="submit" class="register-btn">

Register as Student

    </button>




</form>


</div>


</div>






<!--<script src="{% static 'student_app/register.js' %}"></script>>


</body>

</html>
